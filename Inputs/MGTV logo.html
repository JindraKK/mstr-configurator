<!-- Magenta TV Header Banner for MSTR container -->
<!-- Replace INSTANCE placeholder at runtime for CSS isolation -->
<style id="style-INSTANCE">
.header-INSTANCE {
    display: flex;
    align-items: center;
    gap: 12px;
    background: transparent;
    padding: 12px 18px;
    width: 100%;
    box-sizing: border-box;
    font-family: Tahoma, Geneva, sans-serif;
}

.logo-INSTANCE {
    flex: 0 0 40px;
    width: 40px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo-INSTANCE svg {
    display: block;
    width: 100%;
    height: 100%;
}

.text-block-INSTANCE {
    display: flex;
    flex-direction: column;
    gap: 0px;
    min-width: 0;
}

.title-INSTANCE {
    color: #e20074;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    line-height: 1.2;
    white-space: nowrap;
}

.subtitle-INSTANCE {
    color: #5C6B81;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.3px;
    line-height: 1.35;
}
</style>

<div class="header-INSTANCE">
    <!-- Deutsche Telekom T logo — official SVG, color changed to white -->
    <div class="logo-INSTANCE">
        <svg viewBox="0 0 76.728 91.282" xmlns="http://www.w3.org/2000/svg">
            <g transform="matrix(.2857 0 0 .2857 71.408 28.262)" fill="#ffffff">
                <path d="m-33.599 218.73v-22.192h-15.256c-26.315 0-38.393-15.643-38.393-38.665v-232.6h4.5246c49.283 0 80.582 32.707 80.582 80.797v4.3092h18.745v-107.3h-264.58v107.3h18.745v-4.3092c0-48.09 31.298-80.797 80.582-80.797h4.5246v232.6c0 23.022-12.078 38.665-38.393 38.665h-15.256v22.192z"/>
                <path d="m16.603 111.43h-62.914v-63.129h62.914z"/>
                <path d="m-185.07 111.43h-62.914v-63.129h62.914z"/>
            </g>
        </svg>
    </div>

    <div class="text-block-INSTANCE">
        <div class="title-INSTANCE">MAGENTA TV</div>
        <div class="subtitle-INSTANCE">Overall Platform<br>Performance</div>
    </div>
</div>

<script>
(function() {
    // CSS isolation: replace INSTANCE with unique suffix
    var uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 4);
    var styleEl = document.getElementById('style-INSTANCE');
    if (styleEl) {
        styleEl.id = 'style-' + uid;
        styleEl.textContent = styleEl.textContent.split('INSTANCE').join(uid);
    }
    var container = styleEl ? styleEl.parentElement : document.currentScript.parentElement;
    var els = container.querySelectorAll('[class*="INSTANCE"]');
    for (var i = 0; i < els.length; i++) {
        els[i].className = els[i].className.split('INSTANCE').join(uid);
    }
})();
</script>
