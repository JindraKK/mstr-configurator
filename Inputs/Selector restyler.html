<!--
  MSTR HTML Container: Selector Restyler
  Overrides MSTR DocSelector styling to match dark dashboard theme.
  Colors are baked in at generation time — use the web configurator to regenerate with different values.
-->
<div id="selectorRestylerDoc_INSTANCE" style="background:#141C28;color:#8A95A5;font-family:Consolas,monospace;font-size:10px;padding:8px 10px;line-height:1.5;border-radius:4px;border:1px solid #2A3A50;">
<strong style="color:#E0E0E0;font-size:11px;">SELECTOR RESTYLER</strong><br><br>
<strong style="color:#BCBCBC;">WHAT:</strong> Overrides MSTR DocSelector styling to match dark dashboard theme.<br>
<strong style="color:#BCBCBC;">SCOPE:</strong> Only affects DocSelectors inside .mstrmojo-FilterBox.
</div>
<script>
(function() {
  var uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  var STYLE_ID = 'selectorRestyler_style_' + uid;
  var M = 'jk-dash-selector';
  var docPanel = document.getElementById('selectorRestylerDoc_INSTANCE');
  if (docPanel) docPanel.id = 'selectorRestylerDoc_' + uid;
  var R = M + '-radio';
  /* Checkbox items; search-rebuilt items (no role) count as checkboxes unless the selector is a radio list */
  var CB      = function(st, pe) { return '.' + M + ' div.item' + st + '[role="checkbox"] > span.icon' + pe + ', .' + M + ':not(.' + R + ') div.item' + st + ':not([role]) > span.icon' + pe; };
  /* Radio items; search-rebuilt items in a selector marked as radio list */
  var RB      = function(st, pe) { return '.' + M + ' div.item' + st + '[role="radio"] > span.icon' + pe + ', .' + M + '.' + R + ' div.item' + st + ':not([role]) > span.icon' + pe; };
  var RB_SEL  = function(pe) { return RB('.selected', pe) + ', .' + M + ' div.item[role="radio"][aria-checked="true"] > span.icon' + pe; };
  var css = [
    '.' + M + ' .mstrmojo-ui-SearchBox { background-color:#313131 !important; border:1px solid #35383A !important; border-radius:3px !important; }',
    '.' + M + ' .mstrmojo-ui-sb-input { color:#FFFFFF !important; caret-color:#FFFFFF !important; }',
    '.' + M + ' .mstrmojo-ui-sb-input::placeholder { color:#7A7D80 !important; opacity:1 !important; }',
    '.' + M + ' .mstrmojo-ui-sb-btn { opacity:0.6 !important; }',
    CB('', '') + ' { background-image:none !important; background-color:#313131 !important; border:2px solid #35383A !important; border-radius:3px !important; width:14px !important; height:14px !important; display:inline-block !important; vertical-align:middle !important; position:relative !important; box-sizing:border-box !important; }',
    CB('.selected', '') + ' { background-color:#4A9EBF !important; border-color:#4A9EBF !important; }',
    CB('.selected', '::after') + ' { content:"" !important; position:absolute !important; left:2px !important; top:-3px !important; width:5px !important; height:9px !important; border:solid #FFFFFF !important; border-width:0 2px 2px 0 !important; transform:rotate(45deg) !important; display:block !important; }',
    CB(':hover', '') + ' { border-color:#505456 !important; }',
    RB('', '') + ' { background-image:none !important; background-color:#313131 !important; border:2px solid #35383A !important; border-radius:50% !important; width:14px !important; height:14px !important; display:inline-block !important; vertical-align:middle !important; position:relative !important; box-sizing:border-box !important; }',
    RB(':hover', '') + ' { border-color:#505456 !important; }',
    RB_SEL('') + ' { background-color:#4A9EBF !important; border-color:#4A9EBF !important; }',
    RB_SEL('::after') + ' { content:"" !important; position:absolute !important; left:50% !important; top:50% !important; width:4px !important; height:4px !important; margin:-2px 0 0 -2px !important; border-radius:50% !important; background:#FFFFFF !important; display:block !important; }',
    '.' + M + ' div.item span.text em { background-color:transparent !important; background:transparent !important; color:#E0A030 !important; font-style:normal !important; text-decoration:none !important; }',
  ].join('\n');
  function markDashboardSelectors() { var selectors = document.querySelectorAll('.mstrmojo-DocSelector'); selectors.forEach(function(el) { if (!el.classList.contains(M)) { if (!el.closest('.mstrmojo-FilterBox')) return; el.classList.add(M); } if (!el.classList.contains(R) && el.querySelector('div.item[role="radio"]')) el.classList.add(R); }); }
  function injectCSS(doc) { if (doc.getElementById(STYLE_ID)) return; var tag = doc.createElement('style'); tag.id = STYLE_ID; tag.type = 'text/css'; tag.textContent = css; doc.head.appendChild(tag); }
  function injectToAllFrames() { injectCSS(document); try { if (window.parent && window.parent.document !== document) injectCSS(window.parent.document); } catch(e) {} try { if (window.top && window.top.document !== document) injectCSS(window.top.document); } catch(e) {} }
  function init() { injectToAllFrames(); markDashboardSelectors(); }
  init(); setTimeout(init, 1000); setTimeout(init, 2000); setTimeout(init, 4000);
  var debounceTimer = null;
  var observer = new MutationObserver(function() { if (debounceTimer) clearTimeout(debounceTimer); debounceTimer = setTimeout(markDashboardSelectors, 100); });
  observer.observe(document.body, { childList:true, subtree:true });
  setInterval(markDashboardSelectors, 2000);
})();
</script>
