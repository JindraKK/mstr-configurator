<!DOCTYPE html>
<html lang="en">
<head>
<style id="style-INSTANCE">
  .root-INSTANCE {
    display: flex;
    width: 100%;
  }
  .wrap-INSTANCE {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: default;
    user-select: none;
    padding: 8px 0 0 10px;
  }
  .dot-INSTANCE {
    flex-shrink: 0;
    border-radius: 50%;
    transition: filter 0.2s ease, box-shadow 0.2s ease;
  }
  .wrap-INSTANCE:hover .dot-INSTANCE {
    filter: brightness(1.45);
    box-shadow: 0 0 6px 2px var(--dot-color-INSTANCE);
  }
  .label-INSTANCE {
    white-space: nowrap;
  }
</style>
</head>
<body>

<!-- [INPUT][DATA] Metric — percentage value displayed in the tooltip, e.g. "34.2%" -->
<span id="val-lineartv-pct-INSTANCE" style="display:none">{[UAA - Linear TV %]}</span>

<div id="root-INSTANCE"></div>

<script>
(function () {
  /* ═══════════════════════════════════════════════════════════════
     CONFIGURATION — edit values below
     ═══════════════════════════════════════════════════════════════ */

  // ── Label & appearance ──────────────────────────────────────
  var CONFIG = {
    text:      "LINEAR TV",
    font:      "Tahoma, Arial, sans-serif",
    fontSize:  "14px",
    textColor: "#DEDEDE",
    dotColor:  "#24DBC9",
    align:      "right",       // "left" | "right"
    tooltip:   true,          // true = show tooltip on hover
  };
  // ───────────────────────────────────────────────────────────

  // ── TOOLTIP CONFIGURATION ──────────────────────────────────
  var TOOLTIP = {
    // {VALUE} will be replaced by the metric read from the hidden span above
    html:      'Linear TV users create <strong style="color:#24DBC9;">{VALUE}</strong> of all Total Platform users.',
    font:      "Tahoma, Arial, sans-serif",
    fontSize:  "12px",
    textColor: "#b0bec5",
  };
  // ───────────────────────────────────────────────────────────

  var uid = 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

  var styleEl = document.getElementById('style-INSTANCE');
  styleEl.id  = 'style-' + uid;
  styleEl.textContent = styleEl.textContent.split('INSTANCE').join(uid);

  var valEl = document.getElementById('val-lineartv-pct-INSTANCE');
  valEl.id = 'val-lineartv-pct-' + uid;

  var rootEl = document.getElementById('root-INSTANCE');
  rootEl.id        = 'root-' + uid;
  rootEl.className = 'root-' + uid;
  rootEl.style.justifyContent = CONFIG.align === 'right' ? 'flex-end' : 'flex-start';

  var metricValue = document.getElementById('val-lineartv-pct-' + uid).textContent.trim();

  var fs      = parseFloat(CONFIG.fontSize);
  var unit    = CONFIG.fontSize.replace(/[\d.]/g, '') || 'px';
  var dotSize = (fs * 0.6).toFixed(1) + unit;

  var wrap = document.createElement('div');
  wrap.className = 'wrap-' + uid;
  wrap.style.setProperty('--dot-color-' + uid, CONFIG.dotColor);

  var dot = document.createElement('span');
  dot.className = 'dot-' + uid;
  dot.style.cssText = [
    'width:'            + dotSize,
    'height:'           + dotSize,
    'background-color:' + CONFIG.dotColor,
  ].join(';');

  var label = document.createElement('span');
  label.className   = 'label-' + uid;
  label.textContent = CONFIG.text;
  label.style.cssText = [
    'font-family:' + CONFIG.font,
    'font-size:'   + CONFIG.fontSize,
    'color:'       + CONFIG.textColor,
    'line-height:1',
  ].join(';');

  wrap.appendChild(dot);
  wrap.appendChild(label);
  rootEl.appendChild(wrap);

  if (CONFIG.tooltip) {
    var tipHtml = TOOLTIP.html.replace('{VALUE}', metricValue);

    var tip = document.createElement('div');
    tip.style.cssText = [
      'position:fixed',
      'background:#1a2535',
      'border:1px solid #2e3f55',
      'box-shadow:0 4px 16px rgba(0,0,0,0.45)',
      'border-radius:6px',
      'padding:10px 13px',
      'min-width:200px',
      'max-width:280px',
      'white-space:normal',
      'line-height:1.5',
      'pointer-events:none',
      'opacity:0',
      'transition:opacity 0.15s ease',
      'z-index:9999',
      'font-family:'  + TOOLTIP.font,
      'font-size:'    + TOOLTIP.fontSize,
      'color:'        + TOOLTIP.textColor,
    ].join(';');
    tip.innerHTML = tipHtml;
    document.body.appendChild(tip);

    wrap.addEventListener('mousemove', function (e) {
      // Get tooltip dimensions
      var tipWidth = tip.offsetWidth;
      var tipHeight = tip.offsetHeight;
      
      // Default offset from cursor
      var offsetX = 14;
      var offsetY = 14;
      
      var posX = e.clientX + offsetX;
      var posY = e.clientY + offsetY;
      
      // Check horizontal collision with window edge
      if (posX + tipWidth > window.innerWidth) {
        posX = e.clientX - tipWidth - offsetX;
      }
      
      // Check vertical collision with window edge
      if (posY + tipHeight > window.innerHeight) {
        posY = e.clientY - tipHeight - offsetY;
      }

      tip.style.left    = posX + 'px';
      tip.style.top     = posY + 'px';
      tip.style.opacity = '1';
    });
    wrap.addEventListener('mouseleave', function () {
      tip.style.opacity = '0';
    });
  }

})();
</script>
</body>
</html>
